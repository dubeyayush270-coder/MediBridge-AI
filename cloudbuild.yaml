steps:
  # 1. Build container image with Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/medibridge-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/medibridge-ai:latest'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/medibridge-ai:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/medibridge-ai:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'medibridge-ai'
      - '--image=gcr.io/$PROJECT_ID/medibridge-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=medibridge-ai-4f126,GOOGLE_CLOUD_PROJECT=medibridge-ai-4f126'

images:
  - 'gcr.io/$PROJECT_ID/medibridge-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/medibridge-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
